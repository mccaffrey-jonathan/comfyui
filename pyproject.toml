[project]
name = "comfyui-durable-watermark"
description = "Durable, keyed, rotation/scale/translation/colour-robust invisible image watermark (pure numpy) for AI-content transparency (EU AI Act Art. 50, California SB 942)."

version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.25", "scipy", "Pillow"]

[project.urls]
Repository = "https://github.com/mccaffrey-jonathan/ComfyUI-DurableWatermark"

[tool.comfy]
PublisherId = ""  # set to your registry.comfy.org publisher id before publishing
DisplayName = "Durable Watermark"
Icon = ""

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
